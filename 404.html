<!doctype html>

<title>Page not found · SA Analytical</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#f4f0e8;--card:#faf7f1;--border:rgba(117,103,79,0.16);--accent:#b5943f;--accent-light:#c9aa58;--text:#2e2c29;--text2:#5f5a52;--muted:#8a8278;--charcoal:#2b2b2e;}
  body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased;}
  header{padding:1.5rem 5vw;}
  header img{height:44px;width:auto;display:block;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem 5rem;}
  .card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:3rem 2.75rem;}
  .eyebrow{font-weight:600;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;}
  .eyebrow::before{content:"";width:2.25rem;height:1px;background:var(--accent);}
  h1{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(1.9rem,5vw,2.5rem);line-height:1.1;margin-bottom:1.25rem;}
  h1 span{display:block;color:var(--accent);}
  p{color:var(--text2);font-size:1.05rem;margin-bottom:1rem;}
  .links{list-style:none;margin:1.75rem 0 0;border-top:1px solid var(--border);}
  .links li{border-bottom:1px solid var(--border);}
  .links a{display:flex;justify-content:space-between;align-items:center;padding:.9rem 0;color:var(--text);font-weight:400;text-decoration:none;}
  .links a::after{content:"\2192";color:var(--accent);}
  .links a:hover{color:var(--accent);}
  .btn{display:inline-block;margin-top:2rem;background:var(--accent);color:#1a1a1b;font-weight:600;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:.9rem 1.6rem;border-radius:4px;}
  .btn:hover{background:var(--accent-light);}
  footer{background:var(--charcoal);color:#f5efe6;text-align:center;padding:1.25rem;font-size:.8rem;letter-spacing:.06em;}
  footer a{color:var(--accent-light);text-decoration:none;}
  @media (max-width:560px){.card{padding:2.25rem 1.5rem;}header img{height:36px;}}
</style>
</head>
<body>
  <header><a href="/"><img src="/images/Logo%20H.webp" alt="SA Analytical" width="500" height="197"></a></header>
  <main>
    <div class="card">
      <p class="eyebrow">Error 404</p>
      <h1>This page doesn't exist<span>but we can still help.</span></h1>
      <p>The link may be out of date, or the address may have a typo. Here are some good places to start:</p>
      <ul class="links">
        <li><a href="/#services">Our services</a></li>
        <li><a href="/#resources">Free resources and toolkits</a></li>
        <li><a href="/#insights">Insights</a></li>
        <li><a href="/#contact">Get in touch</a></li>
      </ul>
      <a class="btn" href="/">Back to the homepage</a>
    </div>
  </main>
  <footer>SA Analytical · <a href="mailto:info@sa-analytical.com">info@sa-analytical.com</a></footer>
</body>
</html>
